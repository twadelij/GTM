<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTM Admin - Kwaliteitscontrole</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #ffffff;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            justify-content: center;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-success {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #d63031, #e17055);
            color: white;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #e94560;
        }

        .stat-label {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 5px;
        }

        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .image-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .image-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .image-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .image-card-content {
            padding: 15px;
        }

        .movie-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .image-actions {
            display: flex;
            gap: 10px;
        }

        .image-actions button {
            flex: 1;
            padding: 8px 12px;
            font-size: 0.9rem;
        }

        .blacklisted {
            opacity: 0.5;
            border: 2px solid #e94560;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
        }

        .message {
            text-align: center;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            display: none;
        }

        .message.success {
            background: rgba(0, 184, 148, 0.2);
            border: 1px solid #00b894;
            display: block;
        }

        .message.error {
            background: rgba(214, 48, 49, 0.2);
            border: 1px solid #d63031;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 GTM Admin - Kwaliteitscontrole</h1>

        <div class="controls">
            <button class="btn-primary" onclick="loadRandomImages()">Laad willekeurige stills</button>
            <button class="btn-secondary" onclick="loadBlacklist()">Bekijk blacklist</button>
            <button class="btn-success" onclick="approveAll()">Alles goedkeuren</button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalImages">0</div>
                <div class="stat-label">Totaal getoond</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="blacklistedCount">0</div>
                <div class="stat-label">Op blacklist</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="approvedCount">0</div>
                <div class="stat-label">Goedgekeurd</div>
            </div>
        </div>

        <div class="message" id="message"></div>

        <div class="images-grid" id="imagesGrid">
            <div class="loading">Stills laden...</div>
        </div>
    </div>

    <script>
        const BACKEND_URL = window.location.origin;
        let currentImages = [];

        // Load images automatically on page load
        window.onload = function() {
            loadRandomImages();
        };

        async function loadRandomImages() {
            showMessage('Laden...', 'info');
            
            try {
                // Fetch random movies from TMDB via backend
                const response = await fetch(`${BACKEND_URL}/api/weekly-challenge`);
                const movies = await response.json();
                
                if (!movies || movies.length === 0) {
                    showMessage('Geen films gevonden', 'error');
                    return;
                }

                // Display images from current weekly challenge
                displayImages(movies);
                updateStats(movies.length, 0, movies.length);
                showMessage(`${movies.length} stills geladen`, 'success');
                
            } catch (error) {
                console.error('Error loading images:', error);
                showMessage('Fout bij laden van stills', 'error');
            }
        }

        async function loadBlacklist() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/blacklist`);
                const blacklist = await response.json();
                
                if (blacklist.length === 0) {
                    showMessage('Blacklist is leeg', 'info');
                    return;
                }

                const grid = document.getElementById('imagesGrid');
                grid.innerHTML = '';
                
                blacklist.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'image-card blacklisted';
                    
                    card.innerHTML = `
                        <img src="${item.image_url}" alt="${item.movie_title}">
                        <div class="image-card-content">
                            <div class="movie-title">${item.movie_title}</div>
                            <div class="image-actions">
                                <button class="btn-secondary" onclick="removeFromBlacklist('${item.movie_id}')">Verwijder van blacklist</button>
                            </div>
                        </div>
                    `;
                    
                    grid.appendChild(card);
                });
                
                updateStats(0, blacklist.length, 0);
                showMessage(`${blacklist.length} items op blacklist`, 'info');
                
            } catch (error) {
                console.error('Error loading blacklist:', error);
                showMessage('Fout bij laden van blacklist', 'error');
            }
        }

        function displayImages(movies) {
            const grid = document.getElementById('imagesGrid');
            grid.innerHTML = '';
            
            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'image-card';
                card.dataset.movieId = movie.id;
                
                card.innerHTML = `
                    <img src="${movie.image}" alt="${movie.title}" onerror="this.src='https://via.placeholder.com/300x200?text=Image+Error'">
                    <div class="image-card-content">
                        <div class="movie-title">${movie.title}</div>
                        <div class="image-actions">
                            <button class="btn-success" onclick="approveImage('${movie.id}')">✓ Goed</button>
                            <button class="btn-danger" onclick="blacklistImage('${movie.id}', '${movie.title}', '${movie.image}')">✗ Blacklist</button>
                        </div>
                    </div>
                `;
                
                grid.appendChild(card);
            });
            
            currentImages = movies;
        }

        async function approveImage(movieId) {
            const card = document.querySelector(`[data-movie-id="${movieId}"]`);
            if (card) {
                card.style.opacity = '0.3';
                card.style.pointerEvents = 'none';
                updateStats();
                showMessage('Stil goedgekeurd', 'success');
            }
        }

        async function blacklistImage(movieId, title, image) {
            try {
                const response = await fetch(`${BACKEND_URL}/api/blacklist`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ movie_id: movieId, movie_title: title, image_url: image })
                });
                
                if (response.ok) {
                    const card = document.querySelector(`[data-movie-id="${movieId}"]`);
                    if (card) {
                        card.classList.add('blacklisted');
                        card.style.pointerEvents = 'none';
                        updateStats();
                        showMessage(`"${title}" toegevoegd aan blacklist`, 'success');
                    }
                } else {
                    showMessage('Fout bij toevoegen aan blacklist', 'error');
                }
            } catch (error) {
                console.error('Error adding to blacklist:', error);
                showMessage('Fout bij toevoegen aan blacklist', 'error');
            }
        }

        async function removeFromBlacklist(movieId) {
            try {
                const response = await fetch(`${BACKEND_URL}/api/blacklist`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ movie_id: movieId })
                });
                
                if (response.ok) {
                    loadBlacklist();
                    showMessage('Item verwijderd van blacklist', 'success');
                } else {
                    showMessage('Fout bij verwijderen van blacklist', 'error');
                }
            } catch (error) {
                console.error('Error removing from blacklist:', error);
                showMessage('Fout bij verwijderen van blacklist', 'error');
            }
        }

        function approveAll() {
            const cards = document.querySelectorAll('.image-card:not(.blacklisted)');
            cards.forEach(card => {
                card.style.opacity = '0.3';
                card.style.pointerEvents = 'none';
            });
            updateStats();
            showMessage('Alle stills goedgekeurd', 'success');
        }

        function updateStats(total, blacklisted, approved) {
            if (total !== undefined) {
                document.getElementById('totalImages').textContent = total;
            }
            if (blacklisted !== undefined) {
                document.getElementById('blacklistedCount').textContent = blacklisted;
            }
            if (approved !== undefined) {
                document.getElementById('approvedCount').textContent = approved;
            }
            
            // Calculate from DOM if not provided
            const totalCards = document.querySelectorAll('.image-card').length;
            const blacklistedCards = document.querySelectorAll('.image-card.blacklisted').length;
            const approvedCards = document.querySelectorAll('.image-card:not(.blacklisted)').length - 
                                  document.querySelectorAll('.image-card:not(.blacklisted):not([style*="opacity: 0.3"])').length;
            
            if (total === undefined) document.getElementById('totalImages').textContent = totalCards;
            if (blacklisted === undefined) document.getElementById('blacklistedCount').textContent = blacklistedCards;
            if (approved === undefined) document.getElementById('approvedCount').textContent = approvedCards;
        }

        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            messageEl.style.display = 'block';
            
            setTimeout(() => {
                messageEl.style.display = 'none';
            }, 3000);
        }

        // Initialize
        updateStats(0, 0, 0);
    </script>
</body>
</html>
