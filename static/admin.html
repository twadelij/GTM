<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTM Admin - Kwaliteitscontrole</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #ffffff;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            justify-content: center;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-success {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #d63031, #e17055);
            color: white;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #e94560;
        }

        .stat-label {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 5px;
        }

        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .image-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .image-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .image-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .image-card-content {
            padding: 15px;
        }

        .movie-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .movie-rating {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 10px;
        }

        .movie-rating .rating-value {
            color: #f5c518;
            font-weight: bold;
        }

        .movie-rating .rating-low {
            color: #e94560;
        }

        .movie-rating .rating-high {
            color: #46d369;
        }

        .image-actions {
            display: flex;
            gap: 10px;
        }

        .image-actions button {
            flex: 1;
            padding: 8px 12px;
            font-size: 0.9rem;
        }

        .blacklisted {
            opacity: 0.5;
            border: 2px solid #e94560;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
        }

        .message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            text-align: center;
            padding: 12px 30px;
            border-radius: 8px;
            display: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            pointer-events: none;
        }

        .message.success {
            background: rgba(0, 184, 148, 0.2);
            border: 1px solid #00b894;
            display: block;
        }

        .message.error {
            background: rgba(214, 48, 49, 0.2);
            border: 1px solid #d63031;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 GTM Admin - Kwaliteitscontrole</h1>

        <div class="controls">
            <button class="btn-primary" onclick="loadRandomImages()">Laad willekeurige stills</button>
            <button class="btn-secondary" onclick="loadApproved()">Bekijk goedgekeurd</button>
            <button class="btn-secondary" onclick="loadBlacklist()">Bekijk blacklist</button>
            <button class="btn-success" onclick="approveAll()">Alles goedkeuren</button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalImages">0</div>
                <div class="stat-label">Te beoordelen</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="approvedCount">0</div>
                <div class="stat-label">Goedgekeurd (sessie)</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="rejectedCount">0</div>
                <div class="stat-label">Afgekeurd (sessie)</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="approvedPool">-</div>
                <div class="stat-label">Game pool (10 nodig)</div>
            </div>
        </div>

        <div class="message" id="message"></div>

        <div class="images-grid" id="imagesGrid">
            <div class="loading">Stills laden...</div>
        </div>
    </div>

    <script>
        const BACKEND_URL = window.location.origin;
        let currentImages = [];
        let approvedTotal = 0;
        let rejectedTotal = 0;

        window.onload = function() {
            loadRandomImages();
            refreshPoolCount();
        };

        async function refreshPoolCount() {
            try {
                const r = await fetch(`${BACKEND_URL}/api/approve`);
                const approved = await r.json();
                const el = document.getElementById('approvedPool');
                el.textContent = approved.length;
                el.style.color = approved.length >= 10 ? '#46d369' : '#e94560';
            } catch(e) {}
        }

        async function loadRandomImages() {
            showMessage('Stills ophalen van TMDB (25 films, even geduld)...', 'info');
            approvedTotal = 0;
            rejectedTotal = 0;
            
            try {
                const response = await fetch(`${BACKEND_URL}/api/random-stills?count=25`);
                const movies = await response.json();
                
                if (!movies || movies.length === 0) {
                    showMessage('Geen nieuwe films gevonden', 'error');
                    return;
                }

                currentImages = movies;
                displayImages(movies);
                updateStats();
                showMessage(`${movies.length} nieuwe stills geladen`, 'success');
                
            } catch (error) {
                console.error('Error loading images:', error);
                showMessage('Fout bij laden van stills', 'error');
            }
        }

        async function loadApproved() {
            try {
                const r = await fetch(`${BACKEND_URL}/api/approve`);
                const approved = await r.json();
                
                if (approved.length === 0) {
                    showMessage('Nog geen goedgekeurde films', 'info');
                    return;
                }

                const grid = document.getElementById('imagesGrid');
                grid.innerHTML = '';
                
                approved.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'image-card';
                    card.style.borderColor = '#46d369';
                    card.dataset.movieId = item.movie_id;
                    
                    card.innerHTML = `
                        <img src="${escapeHtml(item.image_url)}" alt="${escapeHtml(item.movie_title)}">
                        <div class="image-card-content">
                            <div class="movie-title">${escapeHtml(item.movie_title)}</div>
                            <div class="movie-rating">TMDB: <span class="rating-value">${item.tmdb_rating}</span></div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                
                showMessage(`${approved.length} goedgekeurde films in game pool`, 'success');
            } catch(e) {
                showMessage('Fout bij laden', 'error');
            }
        }

        async function loadBlacklist() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/blacklist`);
                const blacklist = await response.json();
                
                if (blacklist.length === 0) {
                    showMessage('Blacklist is leeg', 'info');
                    return;
                }

                const grid = document.getElementById('imagesGrid');
                grid.innerHTML = '';
                
                blacklist.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'image-card blacklisted';
                    card.dataset.movieId = item.movie_id;
                    
                    card.innerHTML = `
                        <img src="${escapeHtml(item.image_url)}" alt="${escapeHtml(item.movie_title)}">
                        <div class="image-card-content">
                            <div class="movie-title">${escapeHtml(item.movie_title)}</div>
                            <div class="image-actions">
                                <button class="btn-secondary" data-action="unban" data-id="${item.movie_id}">Verwijder ban</button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                
                showMessage(`${blacklist.length} gebande films`, 'info');
            } catch (error) {
                showMessage('Fout bij laden van blacklist', 'error');
            }
        }

        function displayImages(movies) {
            const grid = document.getElementById('imagesGrid');
            grid.innerHTML = '';
            
            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'image-card';
                card.dataset.movieId = movie.id;
                card.dataset.title = movie.title;
                card.dataset.image = movie.image;
                card.dataset.rating = movie.rating || 0;
                card.dataset.votes = movie.vote_count || 0;
                
                const rating = movie.rating || 0;
                const ratingClass = rating >= 7.5 ? 'rating-high' : rating < 6 ? 'rating-low' : 'rating-value';
                const votes = movie.vote_count || 0;
                
                card.innerHTML = `
                    <img src="${escapeHtml(movie.image)}" alt="${escapeHtml(movie.title)}" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">
                    <div class="image-card-content">
                        <div class="movie-title">${escapeHtml(movie.title)}</div>
                        <div class="movie-rating">TMDB: <span class="${ratingClass}">${rating}</span> (${votes.toLocaleString()} votes)</div>
                        <div class="image-actions">
                            <button class="btn-success" data-action="approve" data-id="${movie.id}">✓ Goed</button>
                            <button class="btn-danger" data-action="reject" data-id="${movie.id}">✗ Foto af</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Event delegation - handles all button clicks (fixes apostrophe bug)
        document.getElementById('imagesGrid').addEventListener('click', async function(e) {
            const btn = e.target.closest('button[data-action]');
            if (!btn) return;
            
            const action = btn.dataset.action;
            const movieId = btn.dataset.id;
            const card = btn.closest('.image-card');
            
            if (action === 'approve') {
                const title = card.dataset.title;
                const image = card.dataset.image;
                const rating = parseFloat(card.dataset.rating) || 0;
                
                try {
                    const r = await fetch(`${BACKEND_URL}/api/approve`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            movie_id: parseInt(movieId),
                            movie_title: title,
                            image_url: image,
                            tmdb_rating: rating
                        })
                    });
                    if (r.ok) {
                        card.remove();
                        approvedTotal++;
                        updateStats();
                        refreshPoolCount();
                        showMessage(`"${title}" goedgekeurd`, 'success');
                    }
                } catch(err) {
                    showMessage('Fout bij goedkeuren', 'error');
                }
            }
            else if (action === 'reject') {
                const image = card.dataset.image;
                const title = card.dataset.title;
                
                try {
                    const r = await fetch(`${BACKEND_URL}/api/reject-still`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            movie_id: parseInt(movieId),
                            image_url: image
                        })
                    });
                    if (r.ok) {
                        card.remove();
                        rejectedTotal++;
                        updateStats();
                        showMessage(`Foto afgekeurd (film kan terugkomen met andere foto)`, 'success');
                    }
                } catch(err) {
                    showMessage('Fout bij afkeuren', 'error');
                }
            }
            else if (action === 'unban') {
                try {
                    const r = await fetch(`${BACKEND_URL}/api/blacklist`, {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ movie_id: parseInt(movieId) })
                    });
                    if (r.ok) {
                        card.remove();
                        showMessage('Film verwijderd van blacklist', 'success');
                    }
                } catch(err) {
                    showMessage('Fout bij verwijderen', 'error');
                }
            }
        });

        async function approveAll() {
            const cards = document.querySelectorAll('.image-card[data-title]');
            for (const card of cards) {
                try {
                    await fetch(`${BACKEND_URL}/api/approve`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            movie_id: parseInt(card.dataset.movieId),
                            movie_title: card.dataset.title,
                            image_url: card.dataset.image,
                            tmdb_rating: parseFloat(card.dataset.rating) || 0
                        })
                    });
                    approvedTotal++;
                } catch(e) {}
            }
            cards.forEach(card => card.remove());
            updateStats();
            refreshPoolCount();
            showMessage(`${cards.length} films goedgekeurd`, 'success');
        }

        function updateStats() {
            const remaining = document.querySelectorAll('.image-card[data-title]').length;
            document.getElementById('totalImages').textContent = remaining;
            document.getElementById('approvedCount').textContent = approvedTotal;
            document.getElementById('rejectedCount').textContent = rejectedTotal;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            messageEl.style.display = 'block';
            
            setTimeout(() => {
                messageEl.style.display = 'none';
            }, 1500);
        }

        updateStats();
    </script>
</body>
</html>
