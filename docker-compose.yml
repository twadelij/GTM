version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: gtm_postgres
    environment:
      POSTGRES_DB: gtm_game
      POSTGRES_USER: gtm_user
      POSTGRES_PASSWORD: gtm_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - gtm_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtm_user -d gtm_game"]
      interval: 10s
      timeout: 5s
      retries: 5

  # GTM Game Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gtm_backend
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://gtm_user:gtm_password@postgres:5432/gtm_game
      - PORT=8888
      - HOST=0.0.0.0
      - ENABLE_AUTHENTICATION=false
      - ENABLE_MONETIZATION=false
      - JWT_SECRET=test-jwt-secret-for-development-only
      - SESSION_SECRET=test-session-secret-for-development-only
      - AD_SERVER=ldap://cbsp.nl
      - AD_BASE_DN=dc=cbsp,dc=nl
      - AD_BIND_USER=sa_ansible
      - AD_BIND_PASSWORD=
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./static:/app/static
      - ./uploads:/app/uploads
    ports:
      - "8888:8888"
    networks:
      - gtm_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  gtm_network:
    driver: bridge
